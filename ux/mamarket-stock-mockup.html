    .skip-link:focus { top: 0; outline: 3px solid #4FC3F7; outline-offset: 2px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .sort-btn { background: none; border: none; font: inherit; cursor: pointer; padding: 0; display: inline-flex; align-items: center; gap: 4px; color: inherit; text-transform: uppercase; letter-spacing: 0.5px; font-size: 12px; font-weight: 600; width: 100%; }
    .sort-btn:focus-visible { outline: 3px solid #0288D1; outline-offset: 2px; border-radius: 2px; }
  </style>

<script>
(function() {
  'use strict';

  function checkLibraries() {
    if (!window.React || !window.ReactDOM || !window.MaterialUI) {
      document.getElementById('root').innerHTML =
        '<div style="padding:40px;font-family:sans-serif;color:#C62828;">' +

  }
  if (!checkLibraries()) return;

  var React = window.React;

  var useState = React.useState;
  var useEffect = React.useEffect;

  var palette = {
    primary: '#1A2340', secondary: '#4FC3F7', background: '#F5F6FA',

  };

    { barcode: '8001234567895', name: 'Tomato Sauce 400g',    qty: 7,  threshold: 10, uom: 'TIN', price: 1.10 },
    { barcode: '8001234567896', name: 'Free Range Eggs x6',   qty: 12, threshold: 6,  uom: 'PKT', price: 2.20 },
    { barcode: '8001234567897', name: 'Greek Yoghurt 500g',   qty: 4,  threshold: 8,  uom: 'PCS', price: 1.85 },
    { barcode: '8001234567898', name: 'Orange Juice 1L',      qty: 18, threshold: 5,  uom: 'BTL', price: 2.75 },

  ];

  var INITIAL_SALES_LOG = [
    { id: 'sl-001', timestamp: '2026-09-28 09:42:11', input: 'Whole Milk 3', items: [{ name: 'Whole Milk 1L', qty: 3 }], status: 'OK' },
    { id: 'sl-002', timestamp: '2026-09-28 09:38:05', input: '8001234567896 2', items: [{ name: 'Free Range Eggs x6', qty: 2 }], status: 'OK' },
    { id: 'sl-003', timestamp: '2026-09-28 09:15:33', input: 'Pasta 5, Eggs 3, Water 12', items: [{ name: 'Pasta Penne 500g', qty: 5 }, { name: 'Free Range Eggs x6', qty: 3 }, { name: 'Sparkling Water 1.5L', qty: 12 }], status: 'OK' },
    { id: 'sl-004', timestamp: '2026-09-27 20:11:44', input: 'Butter x4', items: [{ name: 'Butter 250g', qty: 4 }], status: 'OK' },
    { id: 'sl-005', timestamp: '2026-09-27 18:55:22', input: 'Cheedar 1', items: [], status: 'Fuzzy' }
  ];

  var CHAT_PRODUCT_INITIAL = [
    { id: 1, type: 'system', text: 'Welcome to MaMarket Stock. Scan or type a barcode to add or top-up a product.' },
    { id: 2, type: 'system', text: 'Tip: Hardware barcode scanners work automatically — just scan and the barcode will appear in the input field below.' }
  ];

  var CHAT_SALES_INITIAL = [
    { id: 1, type: 'system', text: '<strong>Chat Sales Entry</strong> — Record sold items by typing in any supported format.' },
    { id: 2, type: 'system', text: '<strong>Formats:</strong><ul style="margin:6px 0 0 16px;line-height:1.8"><li>Cola 5 &nbsp;|&nbsp; Cola x5 (name + qty)</li><li>8001234567890 3 (barcode + qty)</li><li>Cola (name only — system asks qty)</li><li>Cola 5, Fanta 3, Water 12 (batch)</li></ul>' }
  ];

  function alertLevel(qty, threshold) {
    if (qty < 0) return 'danger';
    if (qty <= threshold) return 'warning';
    return 'ok';
  }

  function statusBadgeCls(status) {
    var map = { OK: 'success', Completed: 'success', Warning: 'warning', Partial: 'warning', Fuzzy: 'info', Failed: 'danger' };
    return map[status] || 'grey';
  }

  function levenshtein(a, b) {
    var m = a.length; var n = b.length;
    var dp = [];
    for (var i = 0; i <= m; i++) { dp[i] = [i]; }
    for (var j = 0; j <= n; j++) { dp[0][j] = j; }
    for (var ii = 1; ii <= m; ii++) {
      for (var jj = 1; jj <= n; jj++) {
        if (a[ii - 1] === b[jj - 1]) { dp[ii][jj] = dp[ii - 1][jj - 1]; }
        else { dp[ii][jj] = 1 + Math.min(dp[ii - 1][jj], dp[ii][jj - 1], dp[ii - 1][jj - 1]); }
      }
    }
    return dp[m][n];
  }

  function fuzzyMatch(query, products) {
    var q = query.toLowerCase();
    var scored = products.map(function(p) {
      var name = p.name.toLowerCase();
      var dist = levenshtein(q, name.slice(0, q.length + 3));
      var contains = name.indexOf(q) !== -1 ? 0 : 1;
      return { product: p, score: dist + contains * 2 };
    });
    scored.sort(function(a, b) { return a.score - b.score; });
    return scored.slice(0, 4).filter(function(s) { return s.score <= 6; });
  }

  function parseSingleItem(val) {
    val = val.trim();
    var xMatch = val.match(/^(.+?)\s+x\s*(\d+)$/i);
    if (xMatch) { return { rawName: xMatch[1].trim(), qty: parseInt(xMatch[2], 10) }; }
    var spaceMatch = val.match(/^(.+?)\s+(\d+)$/);
    if (spaceMatch) { return { rawName: spaceMatch[1].trim(), qty: parseInt(spaceMatch[2], 10) }; }
    if (val.length > 0) { return { rawName: val, qty: null }; }
    return null;
  }

  function parseSalesInput(val) {
    if (val.indexOf(',') !== -1) {
      var parts = val.split(',');
      var items = [];
      for (var i = 0; i < parts.length; i++) {
        var parsed = parseSingleItem(parts[i]);
        if (parsed) { items.push(parsed); }
      }
      return items.length > 0 ? items : null;
    }
    var single = parseSingleItem(val);
    return single ? [single] : null;
  }

  function resolveProduct(rawName, products) {
    var byBarcode = products.find(function(p) { return p.barcode === rawName; });
    if (byBarcode) return { exact: byBarcode, fuzzy: [] };
    var byName = products.find(function(p) { return p.name.toLowerCase() === rawName.toLowerCase(); });
    if (byName) return { exact: byName, fuzzy: [] };
    var partial = products.find(function(p) { return p.name.toLowerCase().indexOf(rawName.toLowerCase()) !== -1; });
    if (partial) return { exact: partial, fuzzy: [] };
    return { exact: null, fuzzy: fuzzyMatch(rawName, products) };
  }

  function BarChart(props) {
    var data = props.data;
    var width = 280; var height = 120; var barW = 28; var gap = 10;
    var maxVal = Math.max.apply(null, data.map(function(d) { return d.value; })) || 1;
    var totalW = data.length * (barW + gap) - gap;
    var startX = (width - totalW) / 2;
    return createElement('svg', { width: width, height: height, role: 'img', 'aria-label': props.ariaLabel || 'Bar chart' },
      data.map(function(d, i) {
        var barH = Math.round((d.value / maxVal) * 80);
        var x = startX + i * (barW + gap);
        var y = 90 - barH;

          navItems.map(function(item) {

              key: item.id, href: '#' + item.id,
              className: 'nav-item' + (activePage === item.id ? ' active' : ''),
              onClick: function(e) { e.preventDefault(); setActivePage(item.id); },
              'aria-current': activePage === item.id ? 'page' : undefined,
              'aria-label': item.label
            },
              createElement('span', { className: 'material-icons', 'aria-hidden': 'true' }, item.icon),
              item.label
            );
          })
        ),
        createElement('div', { className: 'sidebar-footer' },
          createElement('div', { className: 'sidebar-user' },
            createElement('div', { className: 'user-avatar', 'aria-hidden': 'true' }, 'AD'),
            createElement('div', null,
              createElement('div', { className: 'user-info' }, 'Admin User'),
              createElement('div', { className: 'user-role' }, 'Administrator')
            )
          )
        )
      ),
      createElement('div', { className: 'main-area' },
        createElement('header', { className: 'topbar', role: 'banner' },
          createElement('h1', { className: 'topbar-title', tabIndex: -1, id: 'page-heading' }, pageTitle[activePage]),
          createElement('div', { className: 'topbar-actions' },
            createElement('button', { className: 'topbar-icon-btn', 'aria-label': 'Notifications' },
              createElement('span', { className: 'material-icons', 'aria-hidden': 'true' }, 'notifications')
            ),
            createElement('button', { className: 'topbar-icon-btn', 'aria-label': 'Settings' },
              createElement('span', { className: 'material-icons', 'aria-hidden': 'true' }, 'settings')
            ),
            createElement('div', { className: 'user-avatar', style: { width: 34, height: 34, fontSize: 13 }, 'aria-label': 'User: Admin', role: 'img' }, 'AD')
          )
        ),
        createElement('main', { id: 'main-content', className: 'content', tabIndex: -1 },
          activePage === 'inventory' ? createElement(InventoryPage, { products: products, setProducts: setProducts }) :
          activePage === 'chat'      ? createElement(ChatProductPage, { products: products, setProducts: setProducts }) :
          activePage === 'sales'     ? createElement(ChatSalesPage, { products: products, setProducts: setProducts, addSalesLog: addSalesLog }) :
          activePage === 'history'   ? createElement(HistoryPage, { salesLog: salesLog }) :
          null
        )
      )
    );
  }

  var container = document.getElementById('root');
  var root = ReactDOM.createRoot(container);
  root.render(createElement(App, null));

})();
</script>
</body>
</html>
